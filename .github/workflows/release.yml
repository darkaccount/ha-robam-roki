name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release zip
        run: |
          zip -r robam_roki.zip custom_components/robam_roki

      - name: Upload zip to release assets
        uses: softprops/action-gh-release@v3
        with:
          files: robam_roki.zip
