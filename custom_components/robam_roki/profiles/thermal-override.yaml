# Built-in category override for the RZQL cooking appliance family.
#
# It inherits the Python thermal driver (extends: python:thermal) and only
# renames one sensor that the driver already exposes.  Nothing else is added,
# removed or re-valued: the entity contract is pinned by
# tests/fixtures/behavior/RZQL.json, which was captured with this profile in
# place.  profiles/thermal-c98a.yaml is the matching *model* override (it adds
# a dt to the match); this file stays the dc-wide one.
#
# This directory belongs to the integration and is replaced on every update.
# Put your own profiles in <Home Assistant config>/robam_roki/profiles/;
# see PROFILES.md in the repository root for the full format.
schema: roki-profile/1
id: thermal-override
extends: python:thermal
match:
  dc: RZQL
sensors:
  # No keys on purpose: presentation-only override.  The driver keeps its
  # existing value function for this sensor.
  top_temperature:
    name: 上管温度
